<svg xmlns="http://www.w3.org/2000/svg" width="940" height="420" viewBox="0 0 940 420" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5c6bc0"/>
    </marker>
  </defs>
  <rect width="940" height="420" fill="#ffffff"/>

  <!-- 顶层 coding-agent -->
  <rect x="360" y="30" width="220" height="62" rx="14" fill="#fff8e1" stroke="#f9a825" stroke-width="2.5"/>
  <text x="470" y="58" text-anchor="middle" font-size="16" font-weight="bold" fill="#e65100">coding-agent</text>
  <text x="470" y="80" text-anchor="middle" font-size="13" fill="#777">旗舰 pi</text>

  <!-- coding-agent -> 五个直接依赖 -->
  <line x1="400" y1="92" x2="110" y2="168" stroke="#5c6bc0" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="440" y1="92" x2="292" y2="168" stroke="#5c6bc0" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="470" y1="92" x2="470" y2="168" stroke="#5c6bc0" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="500" y1="92" x2="648" y2="168" stroke="#5c6bc0" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="540" y1="92" x2="830" y2="168" stroke="#5c6bc0" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 中层五个包 -->
  <rect x="35" y="170" width="150" height="56" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="2"/>
  <text x="110" y="196" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#333">agent</text>
  <text x="110" y="216" text-anchor="middle" font-size="12.5" fill="#777">运行时心脏</text>

  <rect x="215" y="170" width="150" height="56" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="2"/>
  <text x="290" y="196" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#333">ai</text>
  <text x="290" y="216" text-anchor="middle" font-size="12.5" fill="#777">模型翻译层</text>

  <rect x="395" y="170" width="150" height="56" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="2"/>
  <text x="470" y="196" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#333">tui</text>
  <text x="470" y="216" text-anchor="middle" font-size="12.5" fill="#777">终端界面</text>

  <rect x="575" y="170" width="150" height="56" rx="12" fill="#f4f4f8" stroke="#9fa8da" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="650" y="196" text-anchor="middle" font-size="14.5" fill="#666">client</text>
  <text x="650" y="216" text-anchor="middle" font-size="12" fill="#999">实验性</text>

  <rect x="755" y="170" width="150" height="56" rx="12" fill="#f4f4f8" stroke="#9fa8da" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="830" y="196" text-anchor="middle" font-size="14.5" fill="#666">protocol</text>
  <text x="830" y="216" text-anchor="middle" font-size="12" fill="#999">实验性</text>

  <!-- agent/ai -> telemetry -->
  <line x1="110" y1="226" x2="200" y2="318" stroke="#5c6bc0" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="290" y1="226" x2="245" y2="318" stroke="#5c6bc0" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 底层 telemetry -->
  <rect x="120" y="320" width="200" height="56" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="2"/>
  <text x="220" y="346" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#333">telemetry</text>
  <text x="220" y="366" text-anchor="middle" font-size="12.5" fill="#777">纯接口，垫底</text>

  <!-- 图例 -->
  <rect x="620" y="320" width="26" height="18" rx="4" fill="#eef1fb" stroke="#5c6bc0" stroke-width="2"/>
  <text x="656" y="334" font-size="13" fill="#555">核心包</text>
  <rect x="620" y="350" width="26" height="18" rx="4" fill="#f4f4f8" stroke="#9fa8da" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="656" y="364" font-size="13" fill="#555">实验性</text>
</svg>
