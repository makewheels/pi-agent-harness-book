<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5c6bc0"/>
    </marker>
  </defs>
  <rect width="900" height="220" fill="#ffffff"/>

  <rect x="20" y="60" width="190" height="90" rx="14" fill="#eef1fb" stroke="#5c6bc0" stroke-width="2"/>
  <text x="115" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">① 检查 Node</text>
  <text x="115" y="118" text-anchor="middle" font-size="13.5" fill="#555">node -v ≥ 22</text>

  <line x1="215" y1="105" x2="252" y2="105" stroke="#5c6bc0" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="255" y="60" width="190" height="90" rx="14" fill="#eef1fb" stroke="#5c6bc0" stroke-width="2"/>
  <text x="350" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">② 安装 Pi</text>
  <text x="350" y="118" text-anchor="middle" font-size="13.5" fill="#555">npm install -g …</text>

  <line x1="450" y1="105" x2="487" y2="105" stroke="#5c6bc0" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="490" y="60" width="190" height="90" rx="14" fill="#eef1fb" stroke="#5c6bc0" stroke-width="2"/>
  <text x="585" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">③ 配钥匙</text>
  <text x="585" y="118" text-anchor="middle" font-size="13.5" fill="#555">/login 或 API Key</text>

  <line x1="685" y1="105" x2="722" y2="105" stroke="#5c6bc0" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="725" y="60" width="155" height="90" rx="14" fill="#fff8e1" stroke="#f9a825" stroke-width="2.5"/>
  <text x="802" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#e65100">④ 开口</text>
  <text x="802" y="118" text-anchor="middle" font-size="13.5" fill="#555">pi -p "Say ok"</text>

  <text x="450" y="195" text-anchor="middle" font-size="14" fill="#3949ab">四步全通，Pi 就活了</text>
</svg>
