<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5c6bc0"/>
    </marker>
  </defs>
  <rect width="900" height="280" fill="#ffffff"/>

  <rect x="15" y="70" width="125" height="64" rx="12" fill="#fff8e1" stroke="#f9a825" stroke-width="2.5"/>
  <text x="77" y="98" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#e65100">模型申请</text>
  <text x="77" y="118" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#e65100">用工具</text>
  <line x1="140" y1="102" x2="168" y2="102" stroke="#5c6bc0" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="170" y="70" width="125" height="64" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="2"/>
  <text x="232" y="98" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#333">校验参数</text>
  <text x="232" y="118" text-anchor="middle" font-size="12" fill="#777">不合格直接拒</text>
  <line x1="295" y1="102" x2="323" y2="102" stroke="#5c6bc0" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="325" y="70" width="125" height="64" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="2"/>
  <text x="387" y="98" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#333">before 钩子</text>
  <text x="387" y="118" text-anchor="middle" font-size="12" fill="#777">可拦截</text>
  <text x="387" y="172" text-anchor="middle" font-size="12" fill="#e65100">↑ 权限门插在这</text>
  <line x1="450" y1="102" x2="478" y2="102" stroke="#5c6bc0" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="480" y="70" width="125" height="64" rx="12" fill="#fff8e1" stroke="#f9a825" stroke-width="2.5"/>
  <text x="542" y="98" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#e65100">execute</text>
  <text x="542" y="118" text-anchor="middle" font-size="12" fill="#777">真正干活</text>
  <line x1="605" y1="102" x2="633" y2="102" stroke="#5c6bc0" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="635" y="70" width="125" height="64" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="2"/>
  <text x="697" y="98" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#333">after 钩子</text>
  <text x="697" y="118" text-anchor="middle" font-size="12" fill="#777">可改写结果</text>
  <line x1="760" y1="102" x2="788" y2="102" stroke="#5c6bc0" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="790" y="70" width="95" height="64" rx="12" fill="#fff8e1" stroke="#f9a825" stroke-width="2.5"/>
  <text x="837" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">结果</text>
  <text x="837" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">回模型</text>

  <text x="450" y="235" text-anchor="middle" font-size="14" fill="#3949ab">失败不崩溃：execute 抛错被捕获，作为"出错结果"回给模型自己决定下一步</text>
</svg>
