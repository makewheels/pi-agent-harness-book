<svg xmlns="http://www.w3.org/2000/svg" width="640" height="560" viewBox="0 0 640 560" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5c6bc0"/>
    </marker>
  </defs>
  <rect width="640" height="560" fill="#ffffff"/>

  <rect x="230" y="18" width="180" height="40" rx="20" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="320" y="43" text-anchor="middle" font-size="14" font-weight="bold" fill="#e65100">agent_start</text>
  <line x1="320" y1="58" x2="320" y2="80" stroke="#5c6bc0" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="230" y="82" width="180" height="42" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="2"/>
  <text x="320" y="108" text-anchor="middle" font-size="14" fill="#333">turn_start 新一轮</text>
  <line x1="320" y1="124" x2="320" y2="146" stroke="#5c6bc0" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="215" y="148" width="210" height="42" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="2"/>
  <text x="320" y="174" text-anchor="middle" font-size="14" fill="#333">记下你的输入</text>
  <line x1="320" y1="190" x2="320" y2="212" stroke="#5c6bc0" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="215" y="214" width="210" height="42" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="2"/>
  <text x="320" y="240" text-anchor="middle" font-size="14" fill="#333">模型流式作答</text>
  <line x1="320" y1="256" x2="320" y2="278" stroke="#5c6bc0" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="215" y="280" width="210" height="42" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="2"/>
  <text x="320" y="299" text-anchor="middle" font-size="13.5" fill="#333">执行工具</text>
  <text x="320" y="316" text-anchor="middle" font-size="12" fill="#777">结果回填为消息</text>
  <line x1="320" y1="322" x2="320" y2="344" stroke="#5c6bc0" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="230" y="346" width="180" height="42" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="2"/>
  <text x="320" y="372" text-anchor="middle" font-size="14" fill="#333">turn_end 收尾</text>
  <line x1="320" y1="388" x2="320" y2="410" stroke="#5c6bc0" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M 470 431 L 470 103 L 415 103" fill="none" stroke="#f9a825" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="485" y="270" font-size="13" fill="#e65100">还有活</text>
  <text x="485" y="290" font-size="13" fill="#e65100">再来一轮</text>

  <rect x="215" y="412" width="210" height="42" rx="12" fill="#f4f4f8" stroke="#9fa8da" stroke-width="1.5"/>
  <text x="320" y="438" text-anchor="middle" font-size="14" fill="#555">没活了？</text>
  <line x1="320" y1="454" x2="320" y2="478" stroke="#5c6bc0" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="230" y="480" width="180" height="40" rx="20" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="320" y="505" text-anchor="middle" font-size="14" font-weight="bold" fill="#e65100">agent_end</text>
</svg>
