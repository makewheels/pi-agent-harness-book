<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5c6bc0"/>
    </marker>
  </defs>
  <rect width="900" height="210" fill="#ffffff"/>

  <rect x="15" y="60" width="190" height="70" rx="14" fill="#fff8e1" stroke="#f9a825" stroke-width="2.5"/>
  <text x="110" y="90" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#e65100">pi install</text>
  <text x="110" y="112" text-anchor="middle" font-size="12.5" fill="#777">npm: / git: / https:</text>
  <line x1="205" y1="95" x2="245" y2="95" stroke="#5c6bc0" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="247" y="60" width="190" height="70" rx="14" fill="#eef1fb" stroke="#5c6bc0" stroke-width="2"/>
  <text x="342" y="90" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#333">下载 / 克隆</text>
  <text x="342" y="112" text-anchor="middle" font-size="12.5" fill="#777">把零件包拿下来</text>
  <line x1="437" y1="95" x2="477" y2="95" stroke="#5c6bc0" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="479" y="60" width="190" height="70" rx="14" fill="#eef1fb" stroke="#5c6bc0" stroke-width="2"/>
  <text x="574" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">装到 ~/.pi/agent/</text>
  <text x="574" y="110" text-anchor="middle" font-size="12" fill="#777">加 -l 则装到项目本地</text>
  <line x1="669" y1="95" x2="709" y2="95" stroke="#5c6bc0" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="711" y="60" width="174" height="70" rx="14" fill="#fff8e1" stroke="#f9a825" stroke-width="2.5"/>
  <text x="798" y="90" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#e65100">零件生效</text>
  <text x="798" y="112" text-anchor="middle" font-size="12.5" fill="#777">启动或 /reload 后</text>

  <text x="450" y="175" text-anchor="middle" font-size="14" fill="#3949ab">装前看源码——第三方零件是拿你的权限在跑</text>
</svg>
