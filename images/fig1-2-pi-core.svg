<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5c6bc0"/>
    </marker>
    <marker id="arrowUp" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#f9a825"/>
    </marker>
  </defs>
  <rect width="880" height="460" fill="#ffffff"/>

  <!-- 核心 -->
  <rect x="290" y="30" width="300" height="84" rx="14" fill="#eef1fb" stroke="#5c6bc0" stroke-width="2.5"/>
  <text x="440" y="62" text-anchor="middle" font-size="19" font-weight="bold" fill="#333">Pi 核心</text>
  <text x="440" y="92" text-anchor="middle" font-size="14" fill="#555">Agent 循环 + read/write/edit/bash</text>

  <!-- 箭头到零件 -->
  <line x1="320" y1="114" x2="130" y2="180" stroke="#5c6bc0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="114" x2="345" y2="180" stroke="#5c6bc0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="114" x2="555" y2="180" stroke="#5c6bc0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560" y1="114" x2="765" y2="180" stroke="#5c6bc0" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 四种零件 -->
  <rect x="35" y="188" width="190" height="64" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="2"/>
  <text x="130" y="215" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Extensions</text>
  <text x="130" y="238" text-anchor="middle" font-size="13.5" fill="#555">加工具/命令/UI</text>
  <rect x="250" y="188" width="190" height="64" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="2"/>
  <text x="345" y="215" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Skills</text>
  <text x="345" y="238" text-anchor="middle" font-size="13.5" fill="#555">Markdown 能力手册</text>
  <rect x="465" y="188" width="190" height="64" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="2"/>
  <text x="560" y="215" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Prompt Templates</text>
  <text x="560" y="238" text-anchor="middle" font-size="13.5" fill="#555">/名字 快捷方式</text>
  <rect x="680" y="188" width="170" height="64" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="2"/>
  <text x="765" y="215" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Themes</text>
  <text x="765" y="238" text-anchor="middle" font-size="13.5" fill="#555">换个外观</text>

  <!-- 零件市场 -->
  <line x1="440" y1="340" x2="440" y2="262" stroke="#f9a825" stroke-width="2.5" marker-end="url(#arrowUp)"/>
  <rect x="150" y="340" width="580" height="80" rx="14" fill="#fff8e1" stroke="#f9a825" stroke-width="2.5"/>
  <text x="440" y="372" text-anchor="middle" font-size="18" font-weight="bold" fill="#e65100">Pi Packages · 零件市场</text>
  <text x="440" y="400" text-anchor="middle" font-size="14" fill="#555">零件自己写，或一条命令装社区的：pi install npm:… / git:…</text>
</svg>
