<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="Microsoft YaHei, sans-serif">
  <rect width="640" height="440" fill="#ffffff"/>

  <!-- 主干 -->
  <rect x="240" y="24" width="160" height="46" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="2"/>
  <text x="320" y="52" text-anchor="middle" font-size="14" fill="#333">① 你的第一句</text>
  <line x1="320" y1="70" x2="320" y2="98" stroke="#5c6bc0" stroke-width="2"/>
  <rect x="240" y="98" width="160" height="46" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="2"/>
  <text x="320" y="126" text-anchor="middle" font-size="14" fill="#333">② Pi 的回答</text>
  <line x1="320" y1="144" x2="320" y2="172" stroke="#5c6bc0" stroke-width="2"/>
  <rect x="240" y="172" width="160" height="46" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="2"/>
  <text x="320" y="200" text-anchor="middle" font-size="14" fill="#333">③ 你的第二句</text>

  <!-- 分叉点 -->
  <circle cx="320" cy="238" r="9" fill="#f9a825"/>
  <line x1="320" y1="218" x2="320" y2="230" stroke="#5c6bc0" stroke-width="2"/>
  <text x="345" y="243" font-size="12.5" fill="#e65100">分叉点 /fork</text>

  <!-- 左分支 -->
  <line x1="313" y1="245" x2="180" y2="292" stroke="#5c6bc0" stroke-width="2"/>
  <rect x="95" y="292" width="170" height="46" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="2"/>
  <text x="180" y="320" text-anchor="middle" font-size="13.5" fill="#333">A 线 · 原来的走法</text>
  <line x1="180" y1="338" x2="180" y2="366" stroke="#5c6bc0" stroke-width="2"/>
  <rect x="95" y="366" width="170" height="46" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="2"/>
  <text x="180" y="394" text-anchor="middle" font-size="13.5" fill="#333">A 线 · 继续</text>

  <!-- 右分支 -->
  <line x1="327" y1="245" x2="460" y2="292" stroke="#f9a825" stroke-width="2.5"/>
  <rect x="375" y="292" width="170" height="46" rx="12" fill="#fff8e1" stroke="#f9a825" stroke-width="2.5"/>
  <text x="460" y="320" text-anchor="middle" font-size="13.5" fill="#e65100">B 线 · 换个走法</text>
  <line x1="460" y1="338" x2="460" y2="366" stroke="#f9a825" stroke-width="2.5"/>
  <rect x="375" y="366" width="170" height="46" rx="12" fill="#fff8e1" stroke="#f9a825" stroke-width="2.5"/>
  <text x="460" y="394" text-anchor="middle" font-size="13.5" fill="#e65100">B 线 · 继续</text>

  <text x="320" y="430" text-anchor="middle" font-size="13" fill="#999">每条记录靠 id / parentId 串起来，/tree 可在 A、B 线之间跳</text>
</svg>
