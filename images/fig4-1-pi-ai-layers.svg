<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5c6bc0"/>
    </marker>
  </defs>
  <rect width="900" height="460" fill="#ffffff"/>

  <!-- 第1层 Models -->
  <rect x="200" y="24" width="500" height="72" rx="14" fill="#fff8e1" stroke="#f9a825" stroke-width="2.5"/>
  <text x="450" y="52" text-anchor="middle" font-size="17" font-weight="bold" fill="#e65100">第 1 层 · Models 集合</text>
  <text x="450" y="78" text-anchor="middle" font-size="13.5" fill="#666">路由（按模型找提供商）· 合并认证 · stream / complete 便捷调用</text>

  <line x1="320" y1="96" x2="250" y2="150" stroke="#5c6bc0" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="450" y1="96" x2="450" y2="150" stroke="#5c6bc0" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="580" y1="96" x2="650" y2="150" stroke="#5c6bc0" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 第2层 Providers -->
  <rect x="160" y="152" width="180" height="66" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="2"/>
  <text x="250" y="180" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#333">anthropic Provider</text>
  <text x="250" y="201" text-anchor="middle" font-size="12.5" fill="#777">模型目录 + 认证</text>
  <rect x="360" y="152" width="180" height="66" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="2"/>
  <text x="450" y="180" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#333">openai Provider</text>
  <text x="450" y="201" text-anchor="middle" font-size="12.5" fill="#777">模型目录 + 认证</text>
  <rect x="560" y="152" width="180" height="66" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="2"/>
  <text x="650" y="180" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#333">google Provider</text>
  <text x="650" y="201" text-anchor="middle" font-size="12.5" fill="#777">模型目录 + 认证</text>

  <line x1="250" y1="218" x2="220" y2="288" stroke="#5c6bc0" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="450" y1="218" x2="430" y2="288" stroke="#5c6bc0" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="650" y1="218" x2="640" y2="288" stroke="#5c6bc0" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 700 218 C 760 250, 800 270, 800 288" fill="none" stroke="#f9a825" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

  <!-- 第3层 API 实现 -->
  <rect x="120" y="290" width="200" height="58" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="2"/>
  <text x="220" y="315" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#333">anthropic-messages</text>
  <text x="220" y="335" text-anchor="middle" font-size="12" fill="#777">Anthropic 方言</text>
  <rect x="330" y="290" width="200" height="58" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="2"/>
  <text x="430" y="315" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#333">openai-responses</text>
  <text x="430" y="335" text-anchor="middle" font-size="12" fill="#777">OpenAI 方言</text>
  <rect x="540" y="290" width="200" height="58" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="2"/>
  <text x="640" y="315" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#333">google-generative-ai</text>
  <text x="640" y="335" text-anchor="middle" font-size="12" fill="#777">Google 方言</text>
  <rect x="750" y="290" width="130" height="58" rx="12" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="815" y="312" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#e65100">openai-</text>
  <text x="815" y="328" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#e65100">completions</text>
  <text x="815" y="344" text-anchor="middle" font-size="11" fill="#777">兼容协议共用</text>

  <text x="450" y="400" text-anchor="middle" font-size="14" fill="#3949ab">一家 Provider 说一种方言；多家 Provider 可共用同一本"语法书"</text>
  <text x="450" y="424" text-anchor="middle" font-size="12.5" fill="#999">xAI / Groq / Cerebras 等 OpenAI 兼容商都走 openai-completions</text>
</svg>
