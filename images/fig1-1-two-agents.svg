<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5c6bc0"/>
    </marker>
  </defs>
  <rect width="860" height="400" fill="#ffffff"/>

  <!-- 左：整车出厂 -->
  <rect x="20" y="50" width="390" height="310" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="2"/>
  <text x="215" y="88" text-anchor="middle" font-size="20" font-weight="bold" fill="#3949ab">整车出厂</text>
  <text x="215" y="112" text-anchor="middle" font-size="14" fill="#777">Claude Code · Codex</text>
  <rect x="40" y="128" width="170" height="42" rx="8" fill="#ffffff" stroke="#5c6bc0"/>
  <text x="125" y="155" text-anchor="middle" font-size="14" fill="#333">计划模式</text>
  <rect x="225" y="128" width="170" height="42" rx="8" fill="#ffffff" stroke="#5c6bc0"/>
  <text x="310" y="155" text-anchor="middle" font-size="14" fill="#333">权限弹窗</text>
  <rect x="40" y="180" width="170" height="42" rx="8" fill="#ffffff" stroke="#5c6bc0"/>
  <text x="125" y="207" text-anchor="middle" font-size="14" fill="#333">子代理</text>
  <rect x="225" y="180" width="170" height="42" rx="8" fill="#ffffff" stroke="#5c6bc0"/>
  <text x="310" y="207" text-anchor="middle" font-size="14" fill="#333">待办清单</text>
  <rect x="40" y="232" width="170" height="42" rx="8" fill="#ffffff" stroke="#5c6bc0"/>
  <text x="125" y="259" text-anchor="middle" font-size="14" fill="#333">MCP 工具</text>
  <rect x="225" y="232" width="170" height="42" rx="8" fill="#ffffff" stroke="#5c6bc0"/>
  <text x="310" y="259" text-anchor="middle" font-size="14" fill="#333">后台任务</text>
  <text x="215" y="322" text-anchor="middle" font-size="15" fill="#3949ab">出厂即全，但不能改装</text>

  <!-- 右：零件出厂 -->
  <rect x="450" y="50" width="390" height="310" rx="12" fill="#ffffff" stroke="#f9a825" stroke-width="3"/>
  <text x="645" y="88" text-anchor="middle" font-size="20" font-weight="bold" fill="#e65100">零件出厂</text>
  <text x="645" y="112" text-anchor="middle" font-size="14" fill="#777">Pi</text>
  <rect x="545" y="128" width="200" height="58" rx="12" fill="#eef1fb" stroke="#5c6bc0" stroke-width="2"/>
  <text x="645" y="153" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">发动机 + 四个轮子</text>
  <text x="645" y="174" text-anchor="middle" font-size="13.5" fill="#555">循环 + read/write/edit/bash</text>
  <line x1="645" y1="186" x2="645" y2="218" stroke="#5c6bc0" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="470" y="226" width="80" height="44" rx="8" fill="#ffffff" stroke="#5c6bc0" stroke-dasharray="5,4"/>
  <text x="510" y="253" text-anchor="middle" font-size="13.5" fill="#333">扩展</text>
  <rect x="563" y="226" width="80" height="44" rx="8" fill="#ffffff" stroke="#5c6bc0" stroke-dasharray="5,4"/>
  <text x="603" y="253" text-anchor="middle" font-size="13.5" fill="#333">技能</text>
  <rect x="656" y="226" width="80" height="44" rx="8" fill="#ffffff" stroke="#5c6bc0" stroke-dasharray="5,4"/>
  <text x="696" y="253" text-anchor="middle" font-size="13.5" fill="#333">模板</text>
  <rect x="749" y="226" width="80" height="44" rx="8" fill="#ffffff" stroke="#5c6bc0" stroke-dasharray="5,4"/>
  <text x="789" y="253" text-anchor="middle" font-size="13.5" fill="#333">主题</text>
  <text x="645" y="322" text-anchor="middle" font-size="15" fill="#e65100">核心要小，想装什么自己装</text>
